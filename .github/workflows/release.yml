name: Publish verified release

on:
  push:
    tags: ['v[0-9]*']

# Ordinary verification never receives write access. Only the dependent
# publishing job gets a short-lived repository token after all checks pass.
# Ref names pass through quoted env values and must match package version;
# no event/user text is interpolated into shell commands.
permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Require exact package/tag agreement
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -c 'import os, re, tomllib; v = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]; tag = os.environ["RELEASE_TAG"]; assert re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag) and tag == "v" + v, "Release tag must match package version exactly"'
      - name: Build distributions from this verified tag
        run: |
          python -m pip install 'build>=1,<2'
          python -m build
          (cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS.txt)
      - name: Publish release and actual build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.whl dist/*.tar.gz dist/SHA256SUMS.txt --verify-tag --latest --draft=false --prerelease=false --title "Solana Flow $RELEASE_TAG" --notes-file CHANGELOG.md

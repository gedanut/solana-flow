name: Verify Solana Flow

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    env:
      SOLANA_FLOW_REQUIRE_LOCAL_HTTP: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install project and development tools
        run: python -m pip install . 'ruff>=0.11,<1' 'coverage>=7,<8' 'build>=1,<2'
      - name: Lint and formatting
        run: |
          ruff check .
          ruff format --check .
      - name: Tests with branch coverage
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report
      - name: Offline filter logic
        run: node scripts/test_report_controls.cjs
      - name: Build wheel and source distribution
        run: python -m build
      - name: Fresh installed-wheel smoke test
        run: |
          python -m venv .release-venv
          .release-venv/bin/python -m pip install --no-index --no-deps dist/*.whl
          .release-venv/bin/python -I -m solana_flow demo --output .release-demo
          .release-venv/bin/solana-flow analyze .release-demo/snapshot.json --output .release-replay
          cmp .release-demo/ledger.json .release-replay/ledger.json
          cmp .release-demo/index.html docs/demo/index.html
      - name: Upload generated synthetic demo and distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: solana-flow-python-${{ matrix.python }}
          path: |
            .release-demo/
            dist/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

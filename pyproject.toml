[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "solana-flow"
version = "1.0.0"
description = "Exact, read-only Solana net balance-change analytics and offline reports"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "gedanut"}]
dependencies = []

[project.scripts]
solana-flow = "solana_flow.cli:main"

[dependency-groups]
dev = ["ruff>=0.11,<1", "coverage>=7,<8", "build>=1,<2"]

[tool.setuptools.package-data]
solana_flow = ["data/*.json", "assets/*"]

[tool.ruff]
line-length = 100

[tool.coverage.run]
source = ["solana_flow"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
